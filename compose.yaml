services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: ridge
      POSTGRES_USER: ridge
      POSTGRES_PASSWORD: local-training-only
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridge"]
      interval: 2s
      timeout: 2s
      retries: 20
