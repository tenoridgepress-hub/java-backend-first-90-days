server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:mem:ridge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
ridge.jwt.secret=${RIDGE_JWT_SECRET:local-training-key-32-bytes-minimum-never-deploy}
ridge.shipping.url=${SHIPPING_URL:http://127.0.0.1:8091}
ridge.shipping.timeout-ms=${SHIPPING_TIMEOUT_MS:250}
spring.application.name=ridge-orders
spring.jackson.deserialization.accept-float-as-int=false
ridge.shipping.max-body-bytes=${SHIPPING_MAX_BODY_BYTES:16384}
ridge.shipping.max-in-flight=${SHIPPING_MAX_IN_FLIGHT:8}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=1000
spring.jdbc.template.query-timeout=2
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
